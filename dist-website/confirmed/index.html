<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>認証完了 — SitePrinter extension</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Noto Sans JP', sans-serif;
      background: #f8fafc;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      -webkit-font-smoothing: antialiased;
    }
    .card {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 4px 24px rgba(0,0,0,.08);
      padding: 48px 40px;
      max-width: 440px;
      width: 100%;
      text-align: center;
    }
    .icon { font-size: 56px; margin-bottom: 20px; }
    h1 {
      font-size: 22px;
      font-weight: 800;
      color: #0f172a;
      margin-bottom: 12px;
      letter-spacing: -.02em;
    }
    p {
      font-size: 14px;
      color: #64748b;
      line-height: 1.7;
      margin-bottom: 8px;
    }
    .step {
      background: #f1f5f9;
      border-radius: 10px;
      padding: 16px 20px;
      margin: 24px 0 16px;
      text-align: left;
    }
    .step-item {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      font-size: 13px;
      color: #334155;
      line-height: 1.5;
      padding: 6px 0;
    }
    .step-num {
      width: 20px;
      height: 20px;
      background: #2563eb;
      color: #fff;
      border-radius: 50%;
      font-size: 11px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      margin-top: 1px;
    }
    .auto-login-status {
      display: none;
      background: #f0fdf4;
      border: 1px solid #bbf7d0;
      border-radius: 10px;
      padding: 14px 20px;
      margin: 24px 0 16px;
      font-size: 14px;
      font-weight: 600;
      color: #16a34a;
    }
    .actions {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 4px;
    }
    .btn {
      display: inline-block;
      padding: 12px 28px;
      background: #2563eb;
      color: #fff;
      text-decoration: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      border: none;
      cursor: pointer;
      width: 100%;
    }
    .btn:hover { background: #1d4ed8; }
    .btn-secondary {
      background: transparent;
      color: #64748b;
      border: 1px solid #e2e8f0;
      font-size: 13px;
      padding: 10px 28px;
    }
    .btn-secondary:hover { background: #f8fafc; color: #334155; }
    .footer-link {
      display: block;
      margin-top: 24px;
      font-size: 12px;
      color: #94a3b8;
      text-decoration: none;
    }
    .error-box {
      background: #fef2f2;
      border: 1px solid #fecaca;
      border-radius: 10px;
      padding: 16px 20px;
      margin-top: 16px;
      font-size: 13px;
      color: #dc2626;
      display: none;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">✅</div>
    <h1 id="pageTitle">認証が完了しました</h1>
    <p>SitePrinter extension のアカウントが有効になりました。</p>

    <!-- 自動ログイン成功時（コンテンツスクリプトが表示） -->
    <div class="auto-login-status" id="autoLoginStatus">
      ✓ 拡張機能に自動でログインしました
    </div>

    <div class="actions">
      <!-- 拡張機能を開くボタン（コンテンツスクリプトが表示） -->
      <button id="openExtensionBtn" class="btn" style="display:none;">設定画面を開く</button>
      <!-- 閉じるボタン（常に表示） -->
      <button class="btn btn-secondary" id="closeBtn">このウィンドウを閉じる</button>
    </div>

    <div class="error-box" id="errorBox"></div>
    <a href="/" class="footer-link">extension.siteprinter.jp</a>
  </div>

  <script>
    const params = new URLSearchParams(window.location.hash.slice(1));
    const searchParams = new URLSearchParams(window.location.search);

    // Google OAuthのトークンが含まれている場合はタイトルを変更
    if (params.get('provider_token') || params.get('access_token')) {
      const title = document.getElementById('pageTitle');
      if (title) title.textContent = 'ログインが完了しました';
    }

    const error = params.get('error_description') || searchParams.get('error_description');
    if (error) {
      const box = document.getElementById('errorBox');
      box.textContent = 'リンクが無効または期限切れです。再度サインアップするか、確認メールを再送信してください。';
      box.style.display = 'block';
    }

    document.getElementById('closeBtn').addEventListener('click', function() {
      window.close();
      // window.close() が動作しない場合（ブラウザで直接開いたページ）はトップへ
      setTimeout(function() {
        window.location.href = '/';
      }, 300);
    });
  </script>
</body>
</html>
